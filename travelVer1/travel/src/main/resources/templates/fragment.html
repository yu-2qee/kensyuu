<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <!-- meta要素の部品化 -->
    <div th:fragment="meta" th:remove="tag">

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">

    </div>


    <!-- link要素の部品化 -->
    <div th:fragment="styles" th:remove="tag">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              crossorigin="anonymous">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="preconnect"
              href="https://fonts.gstatic.com"
              crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap"
              rel="stylesheet">

        <link th:href="@{/css/style.css}" rel="stylesheet">

    </div>


    <title>部品化用のHTMLファイル</title>

</head>


<body>


<!-- ============================= -->
<!-- ヘッダーの部品化 -->
<!-- ============================= -->

<div th:fragment="header" th:remove="tag">

    <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm moattravel-navbar">

        <div class="container moattravel-container">


            <!-- ロゴ -->
            <a class="navbar-brand"
               th:href="@{/}">

                <img class="moattravel-logo me-1"
                     th:src="@{/images/logo.png}"
                     alt="moat Travel">

            </a>


            <!-- スマホ用メニューボタン -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="navbarSupportedContent">


                <ul class="navbar-nav ms-auto">


                    <!-- ============================= -->
                    <!-- 未ログイン -->
                    <!-- ============================= -->

                    <li class="nav-item"
                        sec:authorize="isAnonymous()">

                        <a class="nav-link"
                           th:href="@{/login}">
                            ログイン
                        </a>

                    </li>


                    <li class="nav-item"
                        sec:authorize="isAnonymous()">

                        <a class="nav-link"
                           th:href="@{/signup}">
                            会員登録
                        </a>

                    </li>



                    <!-- ============================= -->
                    <!-- ログイン済み（一般ユーザー） -->
                    <!-- ============================= -->

                    <li class="nav-item dropdown"
                        sec:authorize="hasRole('ROLE_GENERAL')">


                        <a id="navbarDropdownGeneral"
                           class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown">

                            <span sec:authentication="principal.user.name"></span>

                        </a>


                        <div class="dropdown-menu dropdown-menu-end"
                             aria-labelledby="navbarDropdownGeneral">


                            <!-- 会員情報 -->
                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/user}">

                                会員情報

                            </a>


                            <!-- 予約一覧 -->
                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/reservations}">

                                予約一覧

                            </a>


                            <div class="dropdown-divider"></div>


                            <!-- ログアウト -->
                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/logout}"
                               onclick="event.preventDefault(); document.getElementById('logout-form').submit();">

                                ログアウト

                            </a>


                            <form class="d-none"
                                  id="logout-form"
                                  th:action="@{/logout}"
                                  method="post">
                            </form>


                        </div>

                    </li>



                    <!-- ============================= -->
                    <!-- 管理者メニュー -->
                    <!-- ============================= -->

                    <li class="nav-item dropdown"
                        sec:authorize="hasRole('ROLE_ADMIN')">


                        <!-- 管理者メニュー -->
                        <a id="navbarDropdownAdmin"
                           class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown">

                            管理者メニュー

                        </a>


                        <div class="dropdown-menu dropdown-menu-end"
                             aria-labelledby="navbarDropdownAdmin">


                            <!-- ============================= -->
                            <!-- 管理者ダッシュボード -->
                            <!-- ============================= -->

                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/admin/dashboard}">

                                管理者ダッシュボード

                            </a>


                            <!-- ============================= -->
                            <!-- 会員一覧 -->
                            <!-- ============================= -->

                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/admin/users}">

                                会員一覧

                            </a>


                            <!-- ============================= -->
                            <!-- 民宿一覧 -->
                            <!-- ============================= -->

                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/admin/houses}">

                                民宿一覧

                            </a>


                            <div class="dropdown-divider"></div>


                            <!-- ============================= -->
                            <!-- ログアウト -->
                            <!-- ============================= -->

                            <a class="dropdown-item moattravel-dropdown-item"
                               th:href="@{/logout}"
                               onclick="event.preventDefault(); document.getElementById('admin-logout-form').submit();">

                                ログアウト

                            </a>


                            <form class="d-none"
                                  id="admin-logout-form"
                                  th:action="@{/logout}"
                                  method="post">
                            </form>


                        </div>

                    </li>


                </ul>


            </div>

        </div>

    </nav>

</div>



<!-- ============================= -->
<!-- フッターの部品化 -->
<!-- ============================= -->

<div th:fragment="footer" th:remove="tag">

    <footer>

        <div class="d-flex justify-content-center align-items-center h-100">

            <p class="text-center text-muted small mb-0">

                &copy;Travel All rights reserved.

            </p>

        </div>

    </footer>

</div>



<!-- ============================= -->
<!-- script要素の部品化 -->
<!-- ============================= -->

<div th:fragment="scripts" th:remove="tag">

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous">
    </script>

</div>


</body>

</html>
